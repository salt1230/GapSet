# Linux/WSL + NVIDIA CUDA reference environment, from archived experiment records.
# Run from this repository root: conda env create -f environment.yml
# Then install requirements-cuda.txt after torch is present; see README.
# This pins recorded scientific dependencies, not every transitive/OS package.
name: gapset-r
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip>=24
  - setuptools>=69
  - wheel
  - packaging
  - ninja
  - pip:
      - "--extra-index-url https://download.pytorch.org/whl/cu124"
      - torch==2.5.1+cu124
      - numpy==2.4.6
      - transformers==4.44.2
      - triton==3.1.0
      - "-e .[raw,baselines,plots]"
