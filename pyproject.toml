[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gapset-r"
version = "0.1.0"
description = "Relative support correction for incomplete CSI gesture recognition"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.26,<3", "torch>=2.5,<2.8"]

[project.optional-dependencies]
raw = ["csiread>=1.4,<2"]
baselines = ["einops>=0.8,<1", "transformers==4.44.2", "huggingface_hub==0.36.2", "safetensors==0.8.0"]
plots = ["matplotlib>=3.8,<4"]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]
